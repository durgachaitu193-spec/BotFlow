<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 120" width="110" height="120">
  <title>BotFlow</title>
  <!-- Transparent background on purpose: brand orange reads on both light and
       dark browser chrome, so no light/dark variant switch is needed. -->
  <g stroke="#FF6A00" stroke-width="9" stroke-linecap="round">
    <line x1="32" y1="24" x2="76" y2="42" />
    <line x1="32" y1="60" x2="76" y2="42" />
    <line x1="32" y1="60" x2="76" y2="78" />
    <line x1="32" y1="96" x2="76" y2="78" />
  </g>
  <g fill="#FF6A00">
    <circle cx="32" cy="24" r="14" />
    <circle cx="76" cy="42" r="14" />
    <circle cx="32" cy="60" r="14" />
    <circle cx="76" cy="78" r="14" />
    <circle cx="32" cy="96" r="14" />
  </g>
</svg>
